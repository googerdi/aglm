profile: base

model:
  context_length: 8192
  d_model: 1536
  num_layers: 24
  num_heads: 24
  attention:
    implementation: gqa
    pattern: full_causal
    num_kv_heads: 8
    sliding_window: null
    layer_overrides: {}

tokenizer:
  type: byte_level_bpe
  vocab_size: 65536

training:
  precision: bf16
  gradient_accumulation_steps: 16
  activation_checkpointing: true

hardware:
  target: high_memory_gpu

runtime:
  sdpa_backend: auto
