profile: tiny

model:
  context_length: 512
  d_model: 384
  num_layers: 10
  num_heads: 6
  attention:
    implementation: gqa
    pattern: full_causal
    num_kv_heads: 2
    sliding_window: null
    layer_overrides: {}

tokenizer:
  type: byte_level_bpe
  vocab_size: 8192

training:
  precision: fp32
  gradient_accumulation_steps: 1
  activation_checkpointing: false

hardware:
  target: cpu_or_laptop

runtime:
  sdpa_backend: auto
